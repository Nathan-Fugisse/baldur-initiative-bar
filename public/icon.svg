    <path d="M133 96 L379 96 L403 130 L349 151 L321 151 L321 357 L354 386 L321 416 L256 387 L191 416 L158 386 L191 357 L191 151 L163 151 L109 130 Z"/>
    <path d="M256 53 L270 82 L300 92 L270 103 L256 133 L242 103 L212 92 L242 82 Z"/>
    <path d="M256 379 L270 409 L300 420 L270 431 L256 461 L242 431 L212 420 L242 409 Z"/>
