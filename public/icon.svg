<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Baldur Initiative Bar icon">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a6"/>
      <stop offset="0.25" stop-color="#d9a83c"/>
      <stop offset="0.55" stop-color="#8d5a18"/>
      <stop offset="0.78" stop-color="#e4b94f"/>
      <stop offset="1" stop-color="#6a3d0c"/>
