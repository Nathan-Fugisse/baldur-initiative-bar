    <path d="M238 201 C205 167 164 143 106 127 C128 151 143 174 154 196 C126 181 94 173 63 172 C96 197 121 224 139 253 C111 242 88 241 65 247 C102 263 132 285 151 311 C126 309 103 314 83 325 C121 335 151 352 176 374 C178 336 194 302 220 276 Z"/>
